[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bipv-potential"
version = "0.1.0"
description = "3D BIPV Potential Assessment - rooftop and vertical-surface solar potential from 3D city models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "shapely>=2.0",
    "geopandas>=0.14",
    "pyproj>=3.6",
    "trimesh>=4.0",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.0",
]

[project.optional-dependencies]
pvlib = ["pvlib>=0.10"]
osm = ["osmnx>=1.9"]
viz = ["matplotlib>=3.8", "folium>=0.16"]
parallel = ["ray>=2.9"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[project.scripts]
bipv = "bipv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bipv = ["../config/config.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"